<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="jb-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0062FF" />
    </linearGradient>
    <linearGradient id="border-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0077FE" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#002244" stop-opacity="0.2" />
    </linearGradient>
    <radialGradient id="surface-glow" cx="50%" cy="0%" r="85%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#060B19" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#02040A" />
    </radialGradient>
  </defs>

  <!-- Background Canvas & Glow -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.5" fill="#02040A" />
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.5" fill="url(#surface-glow)" />

  <!-- Outer Glowing Perimeter Border -->
  <rect x="0.75" y="0.75" width="30.5" height="30.5" rx="7.5" fill="none" stroke="url(#border-gradient)" stroke-width="1.5" />

  <!-- JB Brand Monogram -->
  <text
    x="16"
    y="21.5"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', Roboto, sans-serif"
    font-size="14.5"
    font-weight="800"
    letter-spacing="-0.5px"
    fill="url(#jb-gradient)"
  >JB</text>
</svg>