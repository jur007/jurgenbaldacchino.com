<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMetaspins" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E1E" />
      <stop offset="50%" stop-color="#0B1530" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanGlowMeta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0062FF" />
    </linearGradient>
    <filter id="glowMeta" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgMetaspins)" rx="16" />
  
  <!-- Subtle Grid -->
  <g opacity="0.1" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="240" y1="0" x2="240" y2="360" />
    <line x1="360" y1="0" x2="360" y2="360" />
    <line x1="480" y1="0" x2="480" y2="360" />
  </g>

  <circle cx="300" cy="180" r="100" fill="#00F0FF" opacity="0.08" filter="url(#glowMeta)" />

  <!-- App Window Container -->
  <rect x="60" y="45" width="480" height="270" rx="12" fill="#060C1A" stroke="rgba(0, 240, 255, 0.25)" stroke-width="1.5" />
  
  <!-- App Header -->
  <path d="M 60 57 Q 60 45 72 45 L 528 45 Q 540 45 540 57 L 540 80 L 60 80 Z" fill="#0D1836" />
  <circle cx="84" cy="62" r="4" fill="#FF5F56" />
  <circle cx="98" cy="62" r="4" fill="#FFBD2E" />
  <circle cx="112" cy="62" r="4" fill="#27C93F" />
  
  <text x="140" y="66" fill="#00F0FF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.08em">METASPINS.COM</text>
  <rect x="420" y="54" width="105" height="18" rx="9" fill="rgba(0, 240, 255, 0.15)" stroke="rgba(0, 240, 255, 0.4)" stroke-width="1" />
  <text x="440" y="67" fill="#00F0FF" font-family="monospace" font-size="10">⚡ 0.84 BTC</text>

  <!-- Left Sidebar Navigation -->
  <rect x="76" y="92" width="70" height="210" rx="6" fill="rgba(11, 19, 43, 0.6)" />
  <rect x="86" y="106" width="50" height="8" rx="3" fill="#00F0FF" opacity="0.8" />
  <rect x="86" y="124" width="45" height="6" rx="3" fill="rgba(255, 255, 255, 0.2)" />
  <rect x="86" y="140" width="40" height="6" rx="3" fill="rgba(255, 255, 255, 0.15)" />
  <rect x="86" y="156" width="50" height="6" rx="3" fill="rgba(255, 255, 255, 0.15)" />

  <!-- Center Featured Game Grid -->
  <rect x="160" y="92" width="220" height="110" rx="8" fill="rgba(15, 29, 64, 0.8)" stroke="rgba(0, 240, 255, 0.3)" />
  <text x="175" y="125" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="14" font-weight="bold">Live Web3 Crypto Casino</text>
  <text x="175" y="145" fill="#8E9EB5" font-family="system-ui, sans-serif" font-size="10">Real-Time Odds · Instant Payouts</text>
  <rect x="175" y="162" width="90" height="24" rx="12" fill="url(#cyanGlowMeta)" />
  <text x="195" y="178" fill="#02040A" font-family="system-ui, sans-serif" font-size="10" font-weight="bold">PLAY LIVE</text>

  <!-- Lower Sportsbook Cards -->
  <rect x="160" y="214" width="105" height="88" rx="6" fill="rgba(11, 19, 43, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
  <rect x="172" y="226" width="50" height="8" rx="3" fill="#00F0FF" />
  <rect x="172" y="244" width="80" height="6" rx="3" fill="rgba(255, 255, 255, 0.2)" />
  <rect x="172" y="260" width="40" height="16" rx="4" fill="rgba(0, 240, 255, 0.2)" />
  <text x="180" y="272" fill="#00F0FF" font-family="monospace" font-size="9">2.45</text>

  <rect x="275" y="214" width="105" height="88" rx="6" fill="rgba(11, 19, 43, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
  <rect x="287" y="226" width="50" height="8" rx="3" fill="#00F0FF" />
  <rect x="287" y="244" width="80" height="6" rx="3" fill="rgba(255, 255, 255, 0.2)" />
  <rect x="287" y="260" width="40" height="16" rx="4" fill="rgba(0, 240, 255, 0.2)" />
  <text x="295" y="272" fill="#00F0FF" font-family="monospace" font-size="9">1.88</text>

  <!-- Right Live Bet Slip -->
  <rect x="392" y="92" width="134" height="210" rx="8" fill="rgba(11, 19, 43, 0.95)" stroke="rgba(0, 240, 255, 0.2)" />
  <text x="406" y="112" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">Bet Slip (Live)</text>
  <rect x="406" y="125" width="106" height="42" rx="4" fill="rgba(15, 29, 64, 0.7)" />
  <text x="414" y="142" fill="#8E9EB5" font-family="system-ui, sans-serif" font-size="9">Champions League</text>
  <text x="414" y="156" fill="#00F0FF" font-family="monospace" font-size="10" font-weight="bold">Odds: 3.10</text>
  <rect x="406" y="258" width="106" height="30" rx="6" fill="url(#cyanGlowMeta)" />
  <text x="430" y="277" fill="#02040A" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">PLACE BET</text>
</svg>
