<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradBeta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817" />
      <stop offset="50%" stop-color="#071836" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="cyanAccentBeta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077FE" />
    </linearGradient>
    <filter id="glowBeta" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgGradBeta)" rx="16" />

  <!-- Radial grid lines & 2D canvas simulation -->
  <circle cx="300" cy="180" r="140" fill="none" stroke="rgba(0, 240, 255, 0.1)" stroke-dasharray="4,6" />
  <circle cx="300" cy="180" r="90" fill="none" stroke="rgba(0, 240, 255, 0.15)" stroke-dasharray="6,6" />
  <circle cx="300" cy="180" r="40" fill="none" stroke="rgba(0, 240, 255, 0.25)" />

  <!-- Orbiting particles and physics bodies -->
  <line x1="160" y1="180" x2="440" y2="180" stroke="rgba(0, 240, 255, 0.15)" />
  <line x1="300" y1="40" x2="300" y2="320" stroke="rgba(0, 240, 255, 0.15)" />

  <circle cx="300" cy="180" r="18" fill="url(#cyanAccentBeta)" filter="url(#glowBeta)" />
  <circle cx="210" cy="130" r="12" fill="#00F0FF" opacity="0.9" filter="url(#glowBeta)" />
  <circle cx="390" cy="230" r="10" fill="#10B981" opacity="0.9" />
  <circle cx="370" cy="110" r="8" fill="#F59E0B" opacity="0.8" />
  <circle cx="230" cy="240" r="9" fill="#0077FE" opacity="0.8" />

  <!-- Interactive HUD overlay -->
  <rect x="50" y="40" width="130" height="42" rx="8" fill="rgba(8, 15, 30, 0.85)" stroke="rgba(0, 240, 255, 0.2)" />
  <text x="65" y="60" fill="#00F0FF" font-family="monospace" font-size="11" font-weight="bold">60.0 FPS</text>
  <text x="65" y="73" fill="#8E9EB5" font-family="monospace" font-size="9">WebGL 2.0 // Active</text>

  <rect x="420" y="40" width="130" height="42" rx="8" fill="rgba(8, 15, 30, 0.85)" stroke="rgba(0, 240, 255, 0.2)" />
  <text x="435" y="60" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="bold">Phaser 3.8</text>
  <text x="435" y="73" fill="#8E9EB5" font-family="monospace" font-size="9">Physics Engine</text>

  <!-- Connective vectors -->
  <path d="M 210 130 Q 300 100 370 110" fill="none" stroke="rgba(0, 240, 255, 0.4)" stroke-width="2" stroke-dasharray="3,3" />
  <path d="M 390 230 Q 330 270 230 240" fill="none" stroke="rgba(16, 185, 129, 0.4)" stroke-width="2" stroke-dasharray="3,3" />
</svg>
