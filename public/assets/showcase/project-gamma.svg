<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradGamma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040D1A" />
      <stop offset="50%" stop-color="#091A2E" />
      <stop offset="100%" stop-color="#02040A" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="glowGamma" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgGradGamma)" rx="16" />

  <!-- Background Terminal Matrix -->
  <rect x="60" y="45" width="480" height="270" rx="12" fill="#060C18" stroke="rgba(16, 185, 129, 0.2)" stroke-width="1.5" />
  
  <!-- Window title bar -->
  <rect x="60" y="45" width="480" height="36" rx="12" fill="#0A1424" />
  <circle cx="84" cy="63" r="4" fill="#FF5F56" />
  <circle cx="98" cy="63" r="4" fill="#FFBD2E" />
  <circle cx="112" cy="63" r="4" fill="#27C93F" />
  <text x="240" y="67" fill="#8E9EB5" font-family="monospace" font-size="11">ci-pipeline.yml -- runner-01</text>

  <!-- Pipeline Flow Visuals -->
  <!-- Step 1: Commitlint -->
  <rect x="85" y="110" width="110" height="60" rx="8" fill="rgba(11, 19, 43, 0.9)" stroke="rgba(0, 240, 255, 0.3)" />
  <circle cx="105" cy="130" r="5" fill="#00F0FF" />
  <text x="118" y="134" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="bold">Husky</text>
  <text x="105" y="152" fill="#8E9EB5" font-family="sans-serif" font-size="9">Commitlint check</text>

  <!-- Arrow 1 -->
  <path d="M 195 140 L 235 140" stroke="#00F0FF" stroke-width="2" stroke-dasharray="3,3" />
  <polygon points="235,136 243,140 235,144" fill="#00F0FF" />

  <!-- Step 2: ESLint & Vitest -->
  <rect x="245" y="110" width="110" height="60" rx="8" fill="rgba(11, 19, 43, 0.9)" stroke="rgba(16, 185, 129, 0.4)" />
  <circle cx="265" cy="130" r="5" fill="#10B981" />
  <text x="278" y="134" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="bold">Vitest</text>
  <text x="265" y="152" fill="#8E9EB5" font-family="sans-serif" font-size="9">32/32 Passed (100%)</text>

  <!-- Arrow 2 -->
  <path d="M 355 140 L 395 140" stroke="#10B981" stroke-width="2" stroke-dasharray="3,3" />
  <polygon points="395,136 403,140 395,144" fill="#10B981" />

  <!-- Step 3: Cloudflare Deploy -->
  <rect x="405" y="110" width="110" height="60" rx="8" fill="rgba(11, 19, 43, 0.9)" stroke="rgba(16, 185, 129, 0.6)" filter="url(#glowGamma)" />
  <circle cx="425" cy="130" r="5" fill="#10B981" />
  <text x="438" y="134" fill="#F1F5F9" font-family="monospace" font-size="11" font-weight="bold">Deploy</text>
  <text x="425" y="152" fill="#10B981" font-family="sans-serif" font-size="9">Edge: 0s downtime</text>

  <!-- Console Log Terminal -->
  <rect x="85" y="195" width="430" height="100" rx="6" fill="#030712" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="100" y="220" fill="#10B981" font-family="monospace" font-size="10">$ vite build --mode production</text>
  <text x="100" y="240" fill="#8E9EB5" font-family="monospace" font-size="10">✓ 42 modules transformed. dist/index.html 2.34 kB │ gzip: 1.02 kB</text>
  <text x="100" y="260" fill="#00F0FF" font-family="monospace" font-size="10">✓ Built in 420ms. Edge cache deployed successfully.</text>
  <text x="100" y="280" fill="#10B981" font-family="monospace" font-size="10">✨ Done in 1.4s.</text>
</svg>
