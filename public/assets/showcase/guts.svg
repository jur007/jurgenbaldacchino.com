  <rect x="315" y="160" width="58" height="36" rx="6" fill="#120508" stroke="rgba(239, 68, 68, 0.6)" />
  <text x="325" y="174" fill="#EF4444" font-family="system-ui, sans-serif" font-size="9">2</text>
