  <circle cx="98" cy="62" r="4" fill="#FFBD2E" />
  <circle cx="112" cy="62" r="4" fill="#27C93F" />
  
  <text x="140" y="66" fill="#EF4444" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.1em">GUTS SPORTSBOOK · LIVE BETTING</text>
