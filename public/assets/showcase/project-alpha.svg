<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGradAlpha" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070E1E" />
      <stop offset="50%" stop-color="#0B132B" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="accentRedGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4D" />
      <stop offset="100%" stop-color="#FF6B8B" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0077FE" />
    </linearGradient>
    <filter id="glowAlpha" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="360" fill="url(#bgGradAlpha)" rx="16" />
  
  <!-- Subtle Grid -->
  <g opacity="0.12" stroke="#00F0FF" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60" />
    <line x1="0" y1="120" x2="600" y2="120" />
    <line x1="0" y1="180" x2="600" y2="180" />
    <line x1="0" y1="240" x2="600" y2="240" />
    <line x1="0" y1="300" x2="600" y2="300" />
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="200" y1="0" x2="200" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
  </g>

  <!-- Glowing Glow Orb -->
  <circle cx="300" cy="180" r="110" fill="#FF2A4D" opacity="0.08" filter="url(#glowAlpha)" />
  <circle cx="450" cy="100" r="70" fill="#00F0FF" opacity="0.08" filter="url(#glowAlpha)" />

  <!-- Mockup Container -->
  <rect x="70" y="50" width="460" height="260" rx="12" fill="#080F1E" stroke="rgba(0, 240, 255, 0.2)" stroke-width="1.5" />
  
  <!-- Mockup Top Bar -->
  <path d="M 70 62 Q 70 50 82 50 L 518 50 Q 530 50 530 62 L 530 84 L 70 84 Z" fill="#0F1D40" />
  <circle cx="94" cy="67" r="4" fill="#FF5F56" />
  <circle cx="108" cy="67" r="4" fill="#FFBD2E" />
  <circle cx="122" cy="67" r="4" fill="#27C93F" />
  <rect x="150" y="60" width="180" height="14" rx="4" fill="#0B132B" />

  <!-- Sidebar Mockup -->
  <rect x="86" y="98" width="80" height="196" rx="6" fill="rgba(11, 19, 43, 0.6)" />
  <rect x="96" y="112" width="60" height="8" rx="3" fill="rgba(255, 255, 255, 0.15)" />
  <rect x="96" y="130" width="50" height="6" rx="3" fill="rgba(0, 240, 255, 0.4)" />
  <rect x="96" y="146" width="45" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)" />
  <rect x="96" y="162" width="55" height="6" rx="3" fill="rgba(255, 255, 255, 0.1)" />

  <!-- Main Grid Mockup Cards -->
  <rect x="180" y="98" width="100" height="90" rx="8" fill="rgba(15, 29, 64, 0.7)" stroke="rgba(255, 42, 77, 0.3)" />
  <rect x="192" y="112" width="50" height="8" rx="3" fill="#FF2A4D" />
  <rect x="192" y="130" width="76" height="6" rx="3" fill="rgba(255, 255, 255, 0.2)" />
  <rect x="192" y="144" width="60" height="6" rx="3" fill="rgba(255, 255, 255, 0.15)" />
  <rect x="192" y="164" width="76" height="14" rx="4" fill="url(#accentRedGrad)" opacity="0.9" />

  <rect x="294" y="98" width="100" height="90" rx="8" fill="rgba(15, 29, 64, 0.7)" stroke="rgba(0, 240, 255, 0.3)" />
  <rect x="306" y="112" width="50" height="8" rx="3" fill="#00F0FF" />
  <rect x="306" y="130" width="76" height="6" rx="3" fill="rgba(255, 255, 255, 0.2)" />
  <rect x="306" y="144" width="60" height="6" rx="3" fill="rgba(255, 255, 255, 0.15)" />
  <rect x="306" y="164" width="76" height="14" rx="4" fill="url(#cyanGrad)" opacity="0.9" />

  <rect x="408" y="98" width="106" height="196" rx="8" fill="rgba(11, 19, 43, 0.9)" stroke="rgba(255, 255, 255, 0.08)" />
  <rect x="420" y="112" width="60" height="8" rx="3" fill="rgba(255, 255, 255, 0.3)" />
  <rect x="420" y="130" width="82" height="28" rx="4" fill="rgba(15, 29, 64, 0.8)" />
  <rect x="420" y="168" width="82" height="28" rx="4" fill="rgba(15, 29, 64, 0.8)" />
  <rect x="420" y="206" width="82" height="28" rx="4" fill="rgba(15, 29, 64, 0.8)" />
  <rect x="420" y="250" width="82" height="24" rx="6" fill="#00F0FF" opacity="0.8" />

  <!-- Bottom Panel -->
  <rect x="180" y="202" width="214" height="92" rx="8" fill="rgba(11, 19, 43, 0.8)" stroke="rgba(255, 255, 255, 0.08)" />
  <rect x="194" y="216" width="90" height="8" rx="3" fill="rgba(255, 255, 255, 0.3)" />
  <rect x="194" y="234" width="186" height="8" rx="3" fill="rgba(0, 240, 255, 0.2)" />
  <rect x="194" y="252" width="140" height="8" rx="3" fill="rgba(255, 255, 255, 0.15)" />
  <rect x="194" y="270" width="160" height="8" rx="3" fill="rgba(255, 255, 255, 0.1)" />
</svg>
