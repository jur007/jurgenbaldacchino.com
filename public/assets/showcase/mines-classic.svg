<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgMines" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020817" />
      <stop offset="50%" stop-color="#1A0A16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <linearGradient id="gemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#0062FF" />
    </linearGradient>
    <linearGradient id="mineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2A4D" />
      <stop offset="100%" stop-color="#990022" />
    </linearGradient>
    <filter id="glowMines" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgMines)" rx="16" />

  <!-- Outer Game Frame -->
  <rect x="50" y="35" width="500" height="290" rx="14" fill="#090E1F" stroke="rgba(255, 42, 77, 0.25)" stroke-width="1.5" />

  <!-- Top Bar -->
  <rect x="50" y="35" width="500" height="42" rx="14" fill="#131A33" />
  <circle cx="74" cy="56" r="4" fill="#FF5F56" />
  <circle cx="88" cy="56" r="4" fill="#FFBD2E" />
  <circle cx="102" cy="56" r="4" fill="#27C93F" />
  
  <text x="126" y="61" fill="#FF2A4D" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" letter-spacing="0.1em">MINES CLASSIC · PHASER 2D</text>
  <text x="440" y="61" fill="#00F0FF" font-family="monospace" font-size="11">60.0 FPS · WEBGL</text>

  <!-- Left Betting Controls Panel -->
  <rect x="70" y="95" width="130" height="210" rx="8" fill="rgba(11, 19, 43, 0.75)" stroke="rgba(255, 255, 255, 0.08)" />
  <text x="85" y="120" fill="#8E9EB5" font-family="system-ui, sans-serif" font-size="10">BET AMOUNT</text>
  <rect x="85" y="130" width="100" height="26" rx="4" fill="#060B18" stroke="rgba(255, 255, 255, 0.15)" />
  <text x="95" y="147" fill="#F1F5F9" font-family="monospace" font-size="11">0.005 BTC</text>

  <text x="85" y="180" fill="#8E9EB5" font-family="system-ui, sans-serif" font-size="10">MINES COUNT</text>
  <rect x="85" y="190" width="100" height="26" rx="4" fill="#060B18" stroke="rgba(255, 42, 77, 0.3)" />
  <text x="95" y="207" fill="#FF2A4D" font-family="monospace" font-size="11" font-weight="bold">3 MINES</text>

  <rect x="85" y="245" width="100" height="34" rx="6" fill="#10B981" />
  <text x="105" y="267" fill="#02040A" font-family="system-ui, sans-serif" font-size="11" font-weight="bold">CASHOUT</text>

  <!-- 5x5 Mines Tile Grid (Phaser Canvas simulation) -->
  <g transform="translate(225, 95)">
    <!-- Tile Grid Rows -->
    <!-- Row 1 -->
    <rect x="0" y="0" width="48" height="38" rx="6" fill="rgba(15, 29, 64, 0.9)" stroke="rgba(0, 240, 255, 0.3)" />
    <circle cx="24" cy="19" r="9" fill="url(#gemGrad)" filter="url(#glowMines)" />

    <rect x="56" y="0" width="48" height="38" rx="6" fill="rgba(15, 29, 64, 0.9)" stroke="rgba(0, 240, 255, 0.3)" />
    <circle cx="80" cy="19" r="9" fill="url(#gemGrad)" filter="url(#glowMines)" />

    <rect x="112" y="0" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="168" y="0" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="224" y="0" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />

    <!-- Row 2 -->
    <rect x="0" y="44" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="56" y="44" width="48" height="38" rx="6" fill="rgba(15, 29, 64, 0.9)" stroke="rgba(0, 240, 255, 0.3)" />
    <circle cx="80" cy="63" r="9" fill="url(#gemGrad)" filter="url(#glowMines)" />

    <rect x="112" y="44" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="168" y="44" width="48" height="38" rx="6" fill="rgba(255, 42, 77, 0.2)" stroke="rgba(255, 42, 77, 0.6)" />
    <circle cx="192" cy="63" r="9" fill="url(#mineGrad)" filter="url(#glowMines)" />

    <rect x="224" y="44" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />

    <!-- Row 3 -->
    <rect x="0" y="88" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="56" y="88" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="112" y="88" width="48" height="38" rx="6" fill="rgba(15, 29, 64, 0.9)" stroke="rgba(0, 240, 255, 0.3)" />
    <circle cx="136" cy="107" r="9" fill="url(#gemGrad)" filter="url(#glowMines)" />

    <rect x="168" y="88" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="224" y="88" width="48" height="38" rx="6" fill="rgba(15, 29, 64, 0.9)" stroke="rgba(0, 240, 255, 0.3)" />
    <circle cx="248" cy="107" r="9" fill="url(#gemGrad)" filter="url(#glowMines)" />

    <!-- Row 4 -->
    <rect x="0" y="132" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="56" y="132" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="112" y="132" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="168" y="132" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="224" y="132" width="48" height="38" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />

    <!-- Row 5 -->
    <rect x="0" y="176" width="48" height="34" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="56" y="176" width="48" height="34" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="112" y="176" width="48" height="34" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="168" y="176" width="48" height="34" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
    <rect x="224" y="176" width="48" height="34" rx="6" fill="rgba(25, 38, 75, 0.6)" stroke="rgba(255, 255, 255, 0.1)" />
  </g>

  <!-- Multiplier HUD Badge -->
  <rect x="225" y="300" width="272" height="18" rx="9" fill="rgba(0, 240, 255, 0.1)" stroke="rgba(0, 240, 255, 0.3)" />
  <text x="310" y="313" fill="#00F0FF" font-family="monospace" font-size="10" font-weight="bold">CURRENT MULTIPLIER: 2.84x</text>
</svg>
