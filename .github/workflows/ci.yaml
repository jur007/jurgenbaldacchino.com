name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Git for Private Dependencies
        env:
          TOKEN: ${{ secrets.JURGENBALDACCHINO_PHASER_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret JURGENBALDACCHINO_PHASER_READ_TOKEN is empty!"
            exit 1
          fi

          # 1. Clean any stale or corrupted npm cacache
          rm -rf ~/.npm || true

          # 2. Unset default checkout extraheader which overrides PAT authentication
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git config --global --unset-all "http.https://github.com/.extraheader" || true

          # 3. Add multiple URL rewrites to authenticated HTTPS using --add
          git config --global --add url."https://${TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://${TOKEN}@github.com/".insteadOf "ssh://git@github.com:"
          git config --global --add url."https://${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://${TOKEN}@github.com/".insteadOf "git@github.com/"
          git config --global --add url."https://${TOKEN}@github.com/".insteadOf "git+ssh://git@github.com/"
          git config --global --add url."https://${TOKEN}@github.com/".insteadOf "git+ssh://git@github.com:"
          git config --global --add url."https://${TOKEN}@github.com/".insteadOf "git+https://github.com/"

          # 4. Store credentials directly for git credential helper
          git config --global credential.helper store
          echo "https://${TOKEN}@github.com" > ~/.git-credentials
          chmod 600 ~/.git-credentials

      - name: Install dependencies
        env:
          JURGENBALDACCHINO_PHASER_READ_TOKEN: ${{ secrets.JURGENBALDACCHINO_PHASER_READ_TOKEN }}
        run: |
          npm ci || {
            echo "=== GIT CONFIG ==="
            git config --list --show-origin
            echo "=== NPM LOGS ==="
            cat ~/.npm/_logs/*-debug-0.log 2>/dev/null || true
            exit 1
          }

      - name: Verify formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
