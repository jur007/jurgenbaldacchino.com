name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure Git for Private Dependencies
        env:
          PHASER_TOKEN: ${{ secrets.PHASER_GAMES_REPO_TOKEN }}
        run: |
          if [ -z "$PHASER_TOKEN" ]; then
            echo "::error::PHASER_GAMES_REPO_TOKEN secret is missing or empty!"
            exit 1
          fi

          # 1. Rewrite HTTPS calls targeting the private repository to inject the PAT
          git config --global url."https://${PHASER_TOKEN}@github.com/jur007/phaser-games.git".insteadOf "https://github.com/jur007/phaser-games.git"
          git config --global url."https://${PHASER_TOKEN}@github.com/jur007/phaser-games".insteadOf "https://github.com/jur007/phaser-games"

          # 2. Intercept SSH fallback URLs and route them to authenticated HTTPS
          git config --global url."https://${PHASER_TOKEN}@github.com/jur007/phaser-games.git".insteadOf "ssh://git@github.com/jur007/phaser-games.git"
          git config --global url."https://${PHASER_TOKEN}@github.com/jur007/phaser-games.git".insteadOf "git@github.com:jur007/phaser-games.git"

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build