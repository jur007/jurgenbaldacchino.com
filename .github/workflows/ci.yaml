name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Configure Git for Private Dependencies
        env:
          PHASER_TOKEN: ${{ secrets.PHASER_GAMES_REPO_TOKEN }}
        run: |
          # 1. Reroute any SSH calls to clean HTTPS
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          git config --global url."https://github.com/".insteadOf "git@github.com:"

          # 2. Inject the fine-grained PAT via HTTP Basic Auth header
          AUTH_HEADER=$(echo -n "x-access-token:${PHASER_TOKEN}" | base64)
          git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${AUTH_HEADER}"

      - name: Install dependencies
        run: npm ci

      - name: Verify formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
