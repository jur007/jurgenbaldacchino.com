name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure Git for Private Dependencies
        env:
          TOKEN: ${{ secrets.JURGENBALDACCHINO_PHASER_READ_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::Secret JURGENBALDACCHINO_PHASER_READ_TOKEN is empty!"
            exit 1
          fi

          # 1. Clean any stale npm cacache
          rm -rf ~/.npm || true

          # 2. Unset default checkout extraheader which overrides authentication
          git config --local --unset-all "http.https://github.com/.extraheader" || true
          git config --global --unset-all "http.https://github.com/.extraheader" || true

          # 3. Create ~/.netrc without leading whitespace for standard Git/curl authentication
          printf "machine github.com\nlogin x-access-token\npassword %s\n\nmachine api.github.com\nlogin x-access-token\npassword %s\n" "${TOKEN}" "${TOKEN}" > ~/.netrc
          chmod 600 ~/.netrc

          # 4. Reroute all SSH, git+ssh, and https queries to authenticated token HTTPS
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "https://github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git@github.com:"
          git config --global --add url."https://x-access-token:${TOKEN}@github.com/".insteadOf "git+ssh://git@github.com/"
          # 5. Verify token access and print phaser-games refs
          echo "=== PHASER-GAMES REFS ==="
          git ls-remote "https://x-access-token:${TOKEN}@github.com/jur007/phaser-games.git" || {
            echo "::error::Authentication failed! Your JURGENBALDACCHINO_PHASER_READ_TOKEN cannot read https://github.com/jur007/phaser-games.git"
            exit 1
          }

      - name: Install dependencies
        env:
          JURGENBALDACCHINO_PHASER_READ_TOKEN: ${{ secrets.JURGENBALDACCHINO_PHASER_READ_TOKEN }}
        run: |
          npm i

      - name: Verify formatting
        run: npm run format:check

      - name: Run linter
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7

      - name: Build
        run: npm run build
